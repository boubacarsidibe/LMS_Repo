spring.application.name=lms
server.port=${SERVER_PORT:8080}

# Charge backend/.env (non versionné) quand on lance l'application en local depuis
# le dossier backend/. « optional: » évite l'échec en conteneur, où les mêmes clés
# sont fournies par les variables d'environnement de docker-compose.
spring.config.import=optional:file:./.env[.properties]

# ========== PostgreSQL (Configuration Équipe) ==========
# Aucune valeur de repli sur le mot de passe : une valeur committée ici est un
# secret publié, et surtout elle transforme une variable d'environnement oubliée
# en production en connexion silencieuse avec un mot de passe public. Même
# raisonnement que JWT_SECRET plus bas : mieux vaut refuser de démarrer.
# Renseigner SPRING_DATASOURCE_PASSWORD dans backend/.env (voir .env.example) ;
# docker-compose le fournit déjà de son côté.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myappdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schéma est piloté par Flyway (src/main/resources/db/migration), plus par
# Hibernate. « validate » vérifie seulement que les entités correspondent aux
# tables et refuse de démarrer sinon — au lieu de modifier la base en silence.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# ========== Flyway ==========
# baseline-on-migrate : sur une base déjà peuplée (celles de l'équipe), Flyway
# enregistre l'état courant comme version 1 sans rejouer V1__baseline.sql. Sur
# une base vide, il joue le script pour tout créer.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema existant avant introduction de Flyway

# Désactiver Open-In-View pour supprimer le warning Hibernate dans les logs
spring.jpa.open-in-view=false

# Collections paresseuses chargées par lots au lieu d'une requête chacune. Les DTO
# du recrutement lisent les pièces justificatives et les réponses aux critères de
# chaque dossier : sans ce réglage, afficher 200 candidatures déclenchait 400
# requêtes de plus. Les deux collections ne peuvent pas être mises dans le même
# EntityGraph (deux List = MultipleBagFetchException), d'où ce chargement par lots.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ========== CORS ==========
# Origines autorisées à appeler l'API, séparées par des virgules. Le joker « * » est
# impossible : les requêtes portent des identifiants. En production, renseigner le
# domaine réel via APP_CORS_ORIGINS.
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:4200}

# ========== Upload de fichiers ==========
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-http-form-post-size=20MB
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads}

# ========== JWT ==========
# Aucune valeur par défaut : JWT_SECRET est OBLIGATOIRE (voir backend/.env.example).
# L'application refuse de démarrer si la variable est absente, ce qui évite de
# signer les jetons avec une clé publiquement connue.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:6000000}

# ========== SMTP (Brevo) ==========
# Identifiants fournis UNIQUEMENT via variables d'environnement : aucun secret en dur
# ici. MAIL_USERNAME et MAIL_PASSWORD n'ont volontairement PAS de valeur de repli — une
# valeur de repli est committée avec ce fichier, c'est donc un secret publié. La clé
# précédente l'a été et a dû être révoquée : renseigner les identifiants dans
# backend/.env (non versionné), jamais ici.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp-relay.brevo.com}
# Sans ces timeouts, la valeur par defaut de JavaMail est infinie : un SMTP injoignable
# (constate sur Railway, port 587 bloque ou Brevo injoignable) bloquait une requete
# entiere plusieurs minutes par email tente, jusqu'a un 502 cote Vercel avant meme que
# le backend ait repondu — sur une action qui en envoie deux (candidat + admission),
# jusqu'a ~4-5 minutes. Un echec doit se signaler vite, pas silencieusement pendre.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Expéditeur des e-mails transactionnels (doit être un expéditeur vérifié côté Brevo)
app.mail.from=${APP_MAIL_FROM:no-reply@inpg.sn}

# Adresse email du service admission (réception des messages de contact du site public)
app.admission.email=${APP_ADMISSION_EMAIL:admin@inpg.sn}

# Adresse email de l'équipe d'accréditation des écoles de formation (TDR §F)
app.accreditation.email=${APP_ACCREDITATION_EMAIL:accreditation@inpg.sn}

# ========== Recrutement ==========
# Frais de dossier : donnée métier fixée ici et jamais transmise par le client,
# qui pourrait sinon choisir le montant qu'il règle.
app.recrutement.frais-dossier=${APP_FRAIS_DOSSIER:25000}
app.recrutement.devise=${APP_DEVISE:XOF}

# ========== Certificats ==========
# URL publique du frontend, utilisée pour construire le lien de vérification
# encodé dans le QR code d'un certificat (voir CertificatPdfService).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
# Clé de signature HMAC des certificats (voir CertificatSignatureService) : repose
# sur JWT_SECRET par défaut pour ne pas exiger de variable d'environnement
# supplémentaire en développement. Définir CERTIFICAT_SIGNATURE_SECRET en
# production si une rotation indépendante du secret JWT est souhaitée.
certificat.signature.secret=${CERTIFICAT_SIGNATURE_SECRET:${jwt.secret}}
