<div class="bg-background min-h-screen">
  <!-- Voile mobile : referme la barre latérale au clic extérieur -->
  <div
    *ngIf="sidebarMobileOuverte"
    class="fixed inset-0 bg-primary/20 backdrop-blur-sm z-30 md:hidden"
    (click)="basculerSidebarMobile()"></div>

  <!-- Barre latérale -->
  <nav
    class="fixed left-0 top-0 h-full flex flex-col z-40 w-64 border-r border-outline-variant bg-surface-container-lowest shadow-sm transition-transform duration-200 md:translate-x-0 md:flex"
    [class.-translate-x-full]="!sidebarMobileOuverte"
    [class.translate-x-0]="sidebarMobileOuverte"
    aria-label="Navigation de l’espace pédagogique">
    <div class="p-6">
      <h1 class="text-2xl font-extrabold tracking-tight text-primary leading-tight">
        INPG<span class="text-brand"> Pédagogie</span>
      </h1>
      <p class="font-label-sm text-label-sm text-on-surface-variant">Responsable pédagogique</p>
    </div>

    <div class="flex-1 overflow-y-auto px-2 space-y-1">
      <a
        *ngFor="let entree of navigation"
        [routerLink]="entree.lien"
        routerLinkActive="bg-secondary-fixed text-secondary font-medium"
        class="flex items-center gap-3 px-4 py-2 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-all duration-200">
        <span class="material-symbols-outlined">{{ entree.icone }}</span>
        {{ entree.libelle }}
      </a>
    </div>

  </nav>

  <!-- Contenu -->
  <div class="md:ml-64 flex flex-col min-h-screen">
    <header
      class="fixed top-0 right-0 left-0 md:left-64 h-16 border-b border-outline-variant bg-surface-container-lowest/80 backdrop-blur-md flex justify-between items-center px-4 md:px-margin-desktop z-30 shadow-sm">
      <div class="flex items-center gap-3">
        <button
          type="button"
          (click)="basculerSidebarMobile()"
          class="md:hidden p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors"
          aria-label="Ouvrir le menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <p class="font-label-md text-label-md text-on-surface-variant">Espace pédagogique</p>
      </div>

      <!-- Cloche puis menu de compte, aux mêmes places que dans l'espace admission :
           la déconnexion vit dans le menu du profil, pas en bouton isolé de la barre. -->
      <div class="flex items-center gap-3">
        <div class="relative">
          <button id="notification-btn" type="button" class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-all relative" (click)="basculerMenu('notification')" aria-label="Notifications">
            <span class="material-symbols-outlined">notifications</span>
            <span *ngIf="notifications.length > 0" class="absolute -top-1 -right-1 w-5 h-5 bg-error text-white text-[10px] font-bold flex items-center justify-center rounded-full border-2 border-surface-container-lowest">{{ notifications.length }}</span>
          </button>
          <div *ngIf="menuNotificationOuvert" id="notification-dropdown" class="absolute right-0 mt-2 w-80 bg-surface border border-outline-variant rounded-xl shadow-lg z-50">
            <div class="px-4 py-3 border-b border-outline-variant">
              <p class="font-label-md text-label-md text-on-surface">Notifications</p>
            </div>
            <div class="max-h-80 overflow-y-auto">
              <div *ngIf="notifications.length === 0" class="px-4 py-8 text-center">
                <span class="material-symbols-outlined text-3xl text-outline mb-1 block">check_circle</span>
                <p class="font-body-sm text-body-sm text-on-surface-variant">Rien à signaler.</p>
              </div>
              <button *ngFor="let n of notifications" type="button" (click)="ouvrirNotification(n)"
                      class="w-full text-left flex items-start gap-3 px-4 py-3 border-b border-outline-variant last:border-0 hover:bg-surface-container-low transition-colors cursor-pointer">
                <span class="material-symbols-outlined text-[18px] text-secondary mt-0.5">notifications_active</span>
                <span class="font-body-sm text-body-sm text-on-surface">{{ n.message }}</span>
              </button>
            </div>
          </div>
        </div>

        <div class="relative">
          <button id="profile-btn" type="button" class="flex items-center gap-1 ml-2 cursor-pointer group" (click)="basculerMenu('profil')" aria-label="Menu utilisateur" aria-haspopup="menu" [attr.aria-expanded]="menuProfilOuvert">
            <span class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white font-label-md text-label-md border border-outline-variant">{{ initiales }}</span>
            <span class="material-symbols-outlined text-on-surface-variant text-[20px] group-hover:text-primary transition-colors">{{ menuProfilOuvert ? 'expand_less' : 'expand_more' }}</span>
          </button>
          <div *ngIf="menuProfilOuvert" id="profile-dropdown" class="absolute right-0 mt-2 w-56 bg-surface border border-outline-variant rounded-xl shadow-lg py-1 z-50">
            <div class="px-4 py-3 border-b border-outline-variant">
              <p class="font-label-md text-label-md text-on-surface capitalize">{{ nomAffiche }}</p>
              <p class="font-body-sm text-body-sm text-on-surface-variant truncate">{{ emailAffiche }}</p>
            </div>
            <a routerLink="mon-profil" (click)="menuProfilOuvert = false" class="flex items-center gap-3 px-4 py-2.5 text-sm text-on-surface-variant hover:bg-surface-container-low hover:text-primary cursor-pointer transition-colors">
              <span class="material-symbols-outlined text-[20px]">account_circle</span> Mon profil
            </a>
            <hr class="my-1 border-outline-variant">
            <a (click)="seDeconnecter()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-on-surface-variant hover:bg-error-container hover:text-error cursor-pointer transition-colors">
              <span class="material-symbols-outlined text-[20px]">logout</span> Déconnexion
            </a>
          </div>
        </div>
      </div>
    </header>

    <main class="pt-16 min-h-screen">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
