<div *ngIf="user$ | async as user; else loggedOut">
  <div class="flex items-center justify-between p-4 bg-white rounded-lg shadow-sm border border-gray-200">
    <!-- Message de bienvenue -->
    <p class="text-gray-800 font-medium">
      Welcome, <span class="text-indigo-600 font-semibold">{{ user.username }}</span> !
    </p>

    <!-- Bouton Logout (garanti cliquable) -->
    <button 
      type="button"
      (click)="logout()"
      class="relative z-10 cursor-pointer inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 active:bg-red-800 rounded-md shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 select-none"
    >
      Logout
    </button>
  </div>
</div>

<!-- État déconnecté -->
<ng-template #loggedOut>
  <div class="p-4 bg-gray-50 rounded-lg text-center border border-gray-200">
    <p class="text-gray-600 text-sm">Please log in.</p>
  </div>
</ng-template>
