<div *ngIf="sidebarMobileOpen" class="fixed inset-0 bg-primary/20 backdrop-blur-sm z-40 md:hidden" (click)="toggleSidebarMobile()"></div>

<aside
  class="fixed left-0 top-0 h-full w-72 bg-surface-container-lowest border-r border-outline-variant z-50 flex flex-col shadow-sm transition-transform duration-200 md:translate-x-0"
  [class.-translate-x-full]="!sidebarMobileOpen"
  [class.translate-x-0]="sidebarMobileOpen"
>
  <div class="p-margin-desktop mb-4 flex items-center">
    <span class="text-2xl font-extrabold tracking-tight text-primary">INPG<span class="text-brand"> LMS</span></span>
  </div>

  <nav class="flex-1 px-4 space-y-base overflow-y-auto" aria-label="Navigation de l'espace Alumni">
    <a
      *ngFor="let entree of navigation"
      [routerLink]="entree.lien"
      routerLinkActive="bg-primary-container text-on-primary-container shadow-sm"
      class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all font-label-md text-label-md text-on-surface-variant hover:bg-surface-container hover:text-on-surface"
    >
      <span class="material-symbols-outlined">{{ entree.icone }}</span>
      <span class="flex-1 text-label-md">{{ entree.libelle }}</span>
    </a>
  </nav>

  <div class="p-4 border-t border-outline-variant">
    <div class="bg-surface-container-low p-4 rounded-xl">
      <span class="text-label-sm text-on-surface-variant">Matricule</span>
      <p class="font-label-md text-label-md text-on-surface tracking-tight">{{ profil?.matricule || '—' }}</p>
      <p *ngIf="profil?.promotionLibelle" class="text-label-sm text-on-surface-variant mt-1">
        {{ profil?.promotionLibelle }}
      </p>
    </div>
  </div>
</aside>

<div class="md:pl-72">
  <header
    class="fixed top-0 left-0 md:left-72 right-0 h-16 bg-surface/80 backdrop-blur-xl border-b border-outline-variant z-30 flex items-center justify-between px-4 md:px-margin-desktop"
  >
    <div class="flex items-center gap-3">
      <button
        type="button"
        (click)="toggleSidebarMobile()"
        class="md:hidden p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors"
        aria-label="Ouvrir le menu">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <p class="font-label-md text-label-md text-on-surface-variant hidden sm:block">Espace Alumni</p>
    </div>

    <div class="flex items-center gap-stack-lg">
      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <ng-container *ngIf="!chargement">
            <p class="font-label-md text-label-md text-on-surface leading-tight">{{ nomAffiche }}</p>
          </ng-container>
          <div *ngIf="chargement" class="animate-pulse">
            <div class="h-4 w-24 bg-surface-container rounded mb-1"></div>
          </div>
        </div>
        <app-profile-menu
          [initiales]="initiales"
          [nom]="nomAffiche"
          lienProfil="/espace-alumni/mon-profil"
          (deconnexion)="deconnexion()"
        ></app-profile-menu>
      </div>
    </div>
  </header>

  <main class="relative pt-16 min-h-screen bg-background">
    <router-outlet></router-outlet>
  </main>
</div>
