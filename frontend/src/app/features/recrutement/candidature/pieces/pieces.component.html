<div class="max-w-2xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-blue-900 mb-6">Pièces Justificatives</h1>

  <div *ngIf="candidature" class="bg-white rounded-xl shadow-md p-6 border border-blue-100">
    <p class="mb-4">Dossier n° <strong>{{ candidature.numeroDossier }}</strong> — Statut : {{ candidature.statut }}</p>

    <div class="space-y-4">
      <div *ngFor="let type of typesDocuments" class="border rounded-lg p-4 flex items-center justify-between">
        <div>
          <p class="font-medium">{{ type }}</p>
          <p *ngIf="getPieceStatus(type) as piece" class="text-sm" [class.text-green-600]="piece.estConforme" [class.text-gray-500]="!piece.estConforme">
            {{ piece.fichierNomOriginal || 'Fichier téléversé' }}
          </p>
          <p *ngIf="!getPieceStatus(type)" class="text-sm text-red-500">Non téléversé</p>
        </div>
        <input type="file" (change)="onFileSelected($event, type)" [disabled]="uploading" class="text-sm" accept=".pdf,.jpg,.jpeg,.png">
      </div>
    </div>

    <div class="mt-6 flex gap-4">
      <a routerLink="/recrutement/candidature/paiement" [queryParams]="{candidatureId: candidatureId}" class="bg-blue-700 text-white px-6 py-2 rounded-lg hover:bg-blue-800 transition">
        Passer au paiement
      </a>
      <a routerLink="/recrutement/suivi" class="text-blue-600 hover:underline self-center">Voir mes candidatures</a>
    </div>
  </div>

  <div *ngIf="!candidature" class="text-center text-gray-500">Chargement...</div>
</div>
