<div class="max-w-4xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-blue-900 mb-6">Entretiens</h1>
  <div class="bg-white rounded-xl shadow-md p-4 border mb-6 space-y-3">
    <input type="datetime-local" [(ngModel)]="dateHeure" class="w-full rounded-lg border p-2">
    <input [(ngModel)]="lieuOuLien" placeholder="Lieu ou lien" class="w-full rounded-lg border p-2">
    <input type="number" step="0.1" [(ngModel)]="noteEntretien" placeholder="Note" class="w-full rounded-lg border p-2">
    <textarea [(ngModel)]="appreciationGlobale" placeholder="Appréciation globale" class="w-full rounded-lg border p-2" rows="2"></textarea>
    <input type="number" [(ngModel)]="candidatId" placeholder="ID Candidat" class="w-full rounded-lg border p-2">
    <button (click)="creer()" class="bg-blue-700 text-white px-4 py-2 rounded-lg">Ajouter</button>
  </div>
  <div class="space-y-3">
    <div *ngFor="let e of entretiens" class="bg-white p-4 rounded-lg border flex justify-between items-center">
      <div><p class="font-semibold">{{ e.dateHeure | date:'dd/MM/yyyy HH:mm' }}</p><p class="text-sm text-gray-500">{{ e.lieuOuLien }} | Candidat ID: {{ e.candidatId }}</p></div>
      <button (click)="supprimer(e.id)" class="text-red-600 text-sm">Supprimer</button>
    </div>
  </div>
</div>
