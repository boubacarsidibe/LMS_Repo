<div class="max-w-4xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-blue-900 mb-6">Gestion des Sessions</h1>
  <div class="bg-white rounded-xl shadow-md p-4 border border-blue-100 mb-6 space-y-3">
    <input [(ngModel)]="libelle" placeholder="Libellé" class="w-full rounded-lg border-gray-300 p-2 border">
    <input type="date" [(ngModel)]="dateOuverture" class="w-full rounded-lg border-gray-300 p-2 border">
    <input type="date" [(ngModel)]="dateFermeture" class="w-full rounded-lg border-gray-300 p-2 border">
    <label class="flex items-center gap-2"><input type="checkbox" [(ngModel)]="estOuverte"> Session ouverte</label>
    <button (click)="creer()" class="bg-blue-700 text-white px-4 py-2 rounded-lg">Créer</button>
  </div>
  <div class="space-y-3">
    <div *ngFor="let s of sessions" class="bg-white p-4 rounded-lg border shadow-sm flex justify-between items-center">
      <div>
        <p class="font-semibold">{{ s.libelle }}</p>
        <p class="text-sm text-gray-500">{{ s.dateOuverture | date:'dd/MM/yyyy' }} → {{ s.dateFermeture | date:'dd/MM/yyyy' }}</p>
        <p><span [class.text-green-600]="s.estActive" [class.text-red-500]="!s.estActive" class="text-sm">{{ s.estActive ? 'Active' : 'Fermée' }}</span></p>
      </div>
      <button (click)="supprimer(s.id)" class="text-red-600 hover:underline text-sm">Supprimer</button>
    </div>
  </div>
</div>
