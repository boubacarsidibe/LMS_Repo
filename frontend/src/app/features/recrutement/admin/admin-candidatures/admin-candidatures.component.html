<div class="max-w-6xl mx-auto px-4 py-10">
  <h1 class="text-2xl font-bold text-blue-900 mb-6">Candidatures</h1>
  <div class="overflow-x-auto">
    <table class="w-full bg-white rounded-xl shadow-md border border-blue-100">
      <thead class="bg-blue-50 text-left"><tr><th class="p-3">Dossier</th><th class="p-3">Candidat</th><th class="p-3">Session</th><th class="p-3">Statut</th><th class="p-3">Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let c of candidatures" class="border-t">
          <td class="p-3">{{ c.numeroDossier }}</td>
          <td class="p-3">{{ c.candidatNom }} {{ c.candidatPrenom }}</td>
          <td class="p-3 text-sm">{{ c.sessionCandidatureLibelle }}</td>
          <td class="p-3 font-semibold" [class.text-green-600]="c.statut==='ADMIS'" [class.text-red-600]="c.statut==='REJETE'">{{ c.statut }}</td>
          <td class="p-3 flex gap-2 flex-wrap">
            <button *ngIf="c.statut==='SOUMIS'" (click)="validerPreselection(c.id)" class="bg-blue-600 text-white px-2 py-1 rounded text-xs">Valider</button>
            <button *ngIf="c.statut==='EN_COURS_DE_PRESELECTION'" (click)="admettre(c.id)" class="bg-green-600 text-white px-2 py-1 rounded text-xs">Admettre</button>
            <button (click)="rejeter(c.id)" class="bg-red-600 text-white px-2 py-1 rounded text-xs">Rejeter</button>
            <button *ngIf="c.paiement && c.paiement.statut==='EN_ATTENTE'" (click)="simulerPaiement(c.paiement.id)" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">Valider paiement</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
