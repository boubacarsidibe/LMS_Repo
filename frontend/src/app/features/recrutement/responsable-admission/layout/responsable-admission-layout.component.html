<div class="bg-surface min-h-screen">
  <!-- Fond semi-transparent mobile pour fermer la sidebar au clic extérieur -->
  <div *ngIf="sidebarMobileOpen" class="fixed inset-0 bg-primary/20 backdrop-blur-sm z-30 md:hidden" (click)="toggleSidebarMobile()"></div>

  <!-- SideNavBar -->
  <nav id="mobile-sidebar" class="fixed left-0 top-0 h-full flex flex-col z-40 w-64 border-r border-outline-variant bg-surface-container-lowest transition-transform duration-200 md:translate-x-0 md:flex" [class.-translate-x-full]="!sidebarMobileOpen" [class.translate-x-0]="sidebarMobileOpen">
    <div class="p-6 flex items-center gap-4">
      <div>
        <h1 class="font-headline-sm text-headline-sm font-bold text-primary leading-tight">INPG LMS</h1>
        <p class="font-label-sm text-label-sm text-on-surface-variant">Portail Admissions</p>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto px-2 space-y-1">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        class="flex items-center gap-3 px-4 py-2 rounded-lg font-label-md text-label-md transition-all duration-200"
        [class.bg-secondary-fixed]="isActive(item.route)"
        [class.text-secondary]="isActive(item.route)"
        [class.font-medium]="isActive(item.route)"
        [class.text-on-surface-variant]="!isActive(item.route)"
        [class.hover:bg-surface-container-low]="!isActive(item.route)"
      >
        <span
          class="material-symbols-outlined"
          [style.font-variation-settings]="item.filled ? 'FILL 1' : 'FILL 0'"
        >{{ item.icon }}</span>
        {{ item.label }}
      </a>
    </div>
    <div class="p-4 border-t border-outline-variant space-y-1">
      <a routerLink="/responsable-admission/parametres" routerLinkActive="bg-secondary-fixed text-secondary font-medium" class="flex items-center gap-3 px-4 py-2 text-on-surface-variant hover:bg-surface-container-low transition-all duration-200 rounded-lg font-label-md text-label-md">
        <span class="material-symbols-outlined">settings</span>
        Paramètres
      </a>
      <a routerLink="/responsable-admission/aide" routerLinkActive="bg-secondary-fixed text-secondary font-medium" class="flex items-center gap-3 px-4 py-2 text-on-surface-variant hover:bg-surface-container-low transition-all duration-200 rounded-lg font-label-md text-label-md">
        <span class="material-symbols-outlined">help</span>
        Aide
      </a>
    </div>
  </nav>

  <!-- Main Content Wrapper -->
  <div class="md:ml-64 flex flex-col min-h-screen">
    <!-- TopNavBar -->
    <header class="fixed top-0 right-0 left-0 md:left-64 h-16 w-full md:w-auto border-b border-outline-variant bg-surface-container-lowest/80 backdrop-blur-md flex justify-between items-center px-4 md:px-margin-desktop z-30">
      <div class="flex items-center gap-4 md:hidden">
        <button id="mobile-menu-btn" type="button" (click)="toggleSidebarMobile()" class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full" aria-label="Ouvrir le menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="font-headline-sm text-headline-sm font-bold text-primary">Admissions Portal</span>
      </div>
      <div class="hidden md:flex items-center flex-1 max-w-md">
        <div class="relative w-full">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
          <input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none" placeholder="Rechercher..." type="text"/>
        </div>
      </div>
      <div class="flex items-center gap-2 md:gap-4 ml-auto relative">
        <!--
          Deux sources distinctes dans la même cloche :
          - les notifications enregistrées en base pour ce compte (événements datés,
            qui restent jusqu'à ce qu'on les ouvre) ;
          - les alertes recalculées à chaque chargement sur les vraies candidatures
            et sessions (états permanents, sans notion de « lu »).
        -->
        <div class="relative">
          <button id="notification-btn" type="button" class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-all relative" (click)="toggleDropdown('notification')" aria-label="Alertes">
            <span class="material-symbols-outlined">notifications</span>
            <span *ngIf="alertes.length + notificationsPersistees.length > 0" class="absolute -top-1 -right-1 w-5 h-5 bg-error text-white text-[10px] font-bold flex items-center justify-center rounded-full border-2 border-surface-container-lowest">{{ alertes.length + notificationsPersistees.length }}</span>
          </button>
          <div *ngIf="notificationOpen" id="notification-dropdown" class="absolute right-0 mt-2 w-80 bg-surface border border-outline-variant rounded-xl shadow-lg z-50">
            <div class="px-4 py-3 border-b border-outline-variant">
              <p class="font-label-md text-label-md text-on-surface">Alertes</p>
            </div>
            <div class="max-h-80 overflow-y-auto">
              <div *ngIf="alertes.length + notificationsPersistees.length === 0" class="px-4 py-8 text-center">
                <span class="material-symbols-outlined text-3xl text-outline mb-1 block">check_circle</span>
                <p class="font-body-sm text-body-sm text-on-surface-variant">Rien à signaler.</p>
              </div>
              <button *ngFor="let n of notificationsPersistees" type="button" (click)="ouvrirNotification(n)"
                      class="w-full text-left flex items-start gap-3 px-4 py-3 border-b border-outline-variant hover:bg-surface-container-low transition-colors cursor-pointer">
                <span class="material-symbols-outlined text-[18px] text-secondary mt-0.5">notifications_active</span>
                <span class="font-body-sm text-body-sm text-on-surface">{{ n.message }}</span>
              </button>
              <a *ngFor="let a of alertes" [routerLink]="a.route" (click)="notificationOpen = false"
                 class="flex items-start gap-3 px-4 py-3 border-b border-outline-variant last:border-0 hover:bg-surface-container-low transition-colors cursor-pointer">
                <span class="material-symbols-outlined text-[18px] text-secondary mt-0.5">{{ a.icone }}</span>
                <span class="font-body-sm text-body-sm text-on-surface">{{ a.message }}</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Profil -->
        <div class="relative">
          <button id="profile-btn" type="button" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white font-label-md text-label-md ml-2 cursor-pointer border border-outline-variant" (click)="toggleDropdown('profile')" aria-label="Menu utilisateur">
            {{ userInitials }}
          </button>
          <div *ngIf="profileOpen" id="profile-dropdown" class="absolute right-0 mt-2 w-56 bg-surface border border-outline-variant rounded-xl shadow-lg py-1 z-50">
            <div class="px-4 py-3 border-b border-outline-variant">
              <p class="font-label-md text-label-md text-on-surface capitalize">{{ userDisplayName }}</p>
              <p class="font-body-sm text-body-sm text-on-surface-variant truncate">{{ userEmail }}</p>
            </div>
            <a routerLink="/responsable-admission/parametres" (click)="profileOpen = false" class="flex items-center gap-3 px-4 py-2.5 text-sm text-on-surface-variant hover:bg-surface-container-low hover:text-primary cursor-pointer transition-colors">
              <span class="material-symbols-outlined text-[20px]">settings</span> Paramètres
            </a>
            <a routerLink="/responsable-admission/aide" (click)="profileOpen = false" class="flex items-center gap-3 px-4 py-2.5 text-sm text-on-surface-variant hover:bg-surface-container-low hover:text-primary cursor-pointer transition-colors">
              <span class="material-symbols-outlined text-[20px]">help</span> Aide
            </a>
            <hr class="my-1 border-outline-variant">
            <a (click)="logout()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-on-surface-variant hover:bg-error-container hover:text-error cursor-pointer transition-colors">
              <span class="material-symbols-outlined text-[20px]">logout</span> Déconnexion
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content via Router Outlet -->
    <main class="flex-1 pt-20 px-4 md:px-margin-desktop pb-12 overflow-x-hidden max-w-container-max mx-auto w-full">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
