<div class="flex bg-surface min-h-screen">
  <!-- SideNavBar -->
  <nav class="fixed left-0 top-0 h-full flex flex-col z-40 w-64 border-r border-outline-variant bg-surface-container-lowest hidden md:flex">
    <div class="p-6 flex items-center gap-4">
      <div>
        <h1 class="font-headline-sm text-headline-sm font-bold text-primary leading-tight">INPG LMS</h1>
        <p class="font-label-sm text-label-sm text-on-surface-variant">Portail Admissions</p>
      </div>
    </div>
    <div class="flex-1 overflow-y-auto px-2 space-y-1">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        class="flex items-center gap-3 px-4 py-2 rounded-lg font-label-md text-label-md transition-all duration-200"
        [class.bg-secondary-fixed]="isActive(item.route)"
        [class.text-secondary]="isActive(item.route)"
        [class.font-medium]="isActive(item.route)"
        [class.text-on-surface-variant]="!isActive(item.route)"
        [class.hover:bg-surface-container-low]="!isActive(item.route)"
      >
        <span
          class="material-symbols-outlined"
          [style.font-variation-settings]="item.filled ? 'FILL 1' : 'FILL 0'"
        >{{ item.icon }}</span>
        {{ item.label }}
      </a>
    </div>
    <div class="p-4 border-t border-outline-variant space-y-1">
      <a [routerLink]="['/responsable-admission']" class="flex items-center gap-3 px-4 py-2 text-on-surface-variant hover:bg-surface-container-low transition-all duration-200 rounded-lg font-label-md text-label-md">
        <span class="material-symbols-outlined">settings</span>
        Paramètres
      </a>
      <a routerLink="/contact" class="flex items-center gap-3 px-4 py-2 text-on-surface-variant hover:bg-surface-container-low transition-all duration-200 rounded-lg font-label-md text-label-md">
        <span class="material-symbols-outlined">help</span>
        Aide
      </a>
    </div>
  </nav>

  <!-- Main Content Wrapper -->
  <div class="flex-1 md:ml-64 flex flex-col min-h-screen">
    <!-- TopNavBar -->
    <header class="fixed top-0 right-0 left-0 md:left-64 h-16 w-full md:w-auto border-b border-outline-variant bg-surface-container-lowest/80 backdrop-blur-md flex justify-between items-center px-4 md:px-margin-desktop z-30">
      <div class="flex items-center gap-4 md:hidden">
        <button class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="font-headline-sm text-headline-sm font-bold text-primary">Admissions Portal</span>
      </div>
      <div class="hidden md:flex items-center flex-1 max-w-md">
        <div class="relative w-full">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
          <input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg text-body-md focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none" placeholder="Rechercher..." type="text"/>
        </div>
      </div>
      <div class="flex items-center gap-2 md:gap-4 ml-auto relative">
        <button id="notification-btn" class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-all relative" (click)="toggleDropdown('notification')">
          <span class="material-symbols-outlined">notifications</span>
          <span class="absolute -top-1 -right-1 w-5 h-5 bg-error text-white text-[10px] font-bold flex items-center justify-center rounded-full border-2 border-surface-container-lowest">3</span>
        </button>
        <button id="apps-btn" class="p-2 text-on-surface-variant hover:bg-surface-container-low rounded-full transition-all hidden sm:block" (click)="toggleDropdown('apps')">
          <span class="material-symbols-outlined">apps</span>
        </button>
        <button id="profile-btn" class="w-8 h-8 rounded-full bg-surface-tint flex items-center justify-center text-white font-label-md text-label-md ml-2 cursor-pointer border border-outline-variant" (click)="toggleDropdown('profile')">
          <img alt="Admin User" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA-WVxA88Wo21vi3wMfuzGlWUBqzUcoT-rwrVK0oKnc81b_R1Q7_RM0hx5CNKWRVOQWCJu3IpGpqGPAu99rWhE5IsknhXiJK8LziV4KEIzwvXuQg2YoWlwfCX6M0IvqE3EIEichT2thT1AgMPVrj2OErsAN0TrOA878F3u17y809avMzVGcakWsjhOn-nDD1IARyedTi2nV3dFqjDQWSJxyKJ86hC8JtVIm1_rt7U4Ax_4QAvXiDWnt"/>
        </button>
      </div>
    </header>

    <!-- Page Content via Router Outlet -->
    <main class="flex-1 pt-20 px-4 md:px-margin-desktop pb-12 overflow-x-hidden max-w-container-max mx-auto w-full">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
