
    <a  [routerLink]="'/recrutement/catalogue/' + prog.id"
        class="group bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden hover:shadow-lg transition-all duration-300 flex flex-col h-full cursor-pointer no-underline">
        <div class="h-48 w-full relative overflow-hidden bg-surface-container-high">
            <div class="absolute inset-0 bg-cover bg-center group-hover:scale-105 transition-transform duration-500"
                [style.background-image]="'url(' + prog.imageUrl + ')'"></div>
        </div>
        <div class="p-4 flex-grow flex flex-col">
            <div class="flex items-center gap-2 mb-2">
                <span
                    class="px-2 py-1 bg-secondary-container/30 text-on-secondary-container text-xs tracking-[0.05em] font-semibold rounded uppercase">{{
                    prog.niveau }}</span>
                <span class="text-on-surface-variant text-xs tracking-[0.05em] font-semibold">{{ prog.duree }}</span>
            </div>
            <h3
                class="font-headline-sm text-headline-sm text-on-surface mb-2 group-hover:text-primary transition-colors">
                {{ prog.titre }}</h3>
            <p class="font-body-sm text-body-sm text-on-surface-variant mb-4 flex-grow">{{ prog.description }}</p>
            <div class="mt-auto pt-3 border-t border-outline-variant flex items-center justify-between">
                <span class="font-body-sm text-body-sm leading-4 tracking-[0.01em] font-medium text-primary">En savoir plus</span>
                <span class="material-symbols-outlined text-primary group-hover:translate-x-1 transition-transform"
                    style="font-variation-settings: 'FILL' 0;">arrow_right_alt</span>
            </div>
        </div>
    </a>
