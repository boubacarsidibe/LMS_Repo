<div class="card group relative bg-white rounded-2xl overflow-hidden border border-slate-200/80 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col h-full">
  
  <!-- Image & Badge -->
  <div class="card-media relative h-48 w-full overflow-hidden bg-slate-100">
    <img [src]="formation.image || 'images/image_lms_accueil.jpeg'" [alt]="formation.intitule" class="w-full h-full object-cover">
    
    <!-- Badge Catégorie / Domaine -->
    <div class="badge absolute left-4 top-4 bg-white/90 backdrop-blur-md text-slate-800 px-3.5 py-1 rounded-full text-xs font-semibold shadow-sm border border-white/20">
      {{ formation.categorie || formation.code || 'Module Stratégique' }}
    </div>
  </div>

  <!-- Contenu de la carte -->
  <div class="p-5 flex flex-col flex-1">
    
    <!-- Titre & Favori -->
    <div class="flex items-start justify-between gap-3 mb-2">
      <h3 class="title text-lg font-bold text-slate-900 leading-snug line-clamp-2">
        {{ formation.intitule }}
      </h3>
      <button class="fav text-outline hover:text-error transition-colors p-1 -mr-1 -mt-1 flex-shrink-0" (click)="toggleFavorite($event)" [attr.aria-label]="formation.favorite ? 'Retirer des favoris' : 'Ajouter aux favoris'">
        <span class="material-symbols-outlined text-xl">
          {{ formation.favorite ? 'favorite' : 'favorite_border' }}
        </span>
      </button>
    </div>

    <!-- Intervenant / Enseignant -->
    <div class="author-row flex items-center gap-1.5 text-xs font-medium text-slate-500 mb-6">
      <span class="material-symbols-outlined text-base">person</span>
      <span class="author">{{ formation.enseignant || 'Dr. Marc-Antoine Laurent' }}</span>
    </div>

    <!-- Progression (Alignée en bas) -->
    <div class="progress-section mt-auto">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs font-medium text-slate-500">Progression</span>
        <span class="text-xs font-bold text-slate-700">{{ formation.progression || 0 }}%</span>
      </div>
      <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full bg-blue-900 rounded-full transition-all duration-500" [style.width.%]="formation.progression || 0"></div>
      </div>
    </div>

    <!-- Bouton d'action -->
    <div class="mt-5">
      <button class="w-full py-3 px-4 bg-primary hover:bg-primary/90 text-white rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-colors" (click)="continuer($event)">
        Continuer le cours
        <span class="material-symbols-outlined text-lg">arrow_forward</span>
      </button>
    </div>

  </div>
</div>
