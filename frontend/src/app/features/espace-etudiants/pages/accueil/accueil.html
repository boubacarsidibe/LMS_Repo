<main class="flex-grow flex items-center justify-center pt-16">
  <section class="relative w-full py-stack-lg overflow-hidden">
    <div class="absolute inset-0 academic-grid-pattern opacity-30 pointer-events-none"></div>
    <div class="relative w-full max-w-4xl mx-auto px-margin-mobile text-center space-y-stack-lg">
      <div class="inline-flex items-center gap-stack-sm px-stack-md py-1 bg-secondary-container text-on-secondary-container rounded-full mx-auto">
        <span class="material-symbols-outlined text-[18px]">school</span>
        <span class="font-label-sm uppercase tracking-wider">Portail Académique Interne</span>
      </div>
      <div class="space-y-stack-sm">
        <h1 class="font-display text-display text-primary leading-tight">
          Espace Apprenant INPG
        </h1>
        <p class="font-body-lg text-on-surface-variant max-w-2xl mx-auto">
          Accédez à vos ressources pédagogiques, suivez votre progression et connectez-vous avec vos pairs au sein de l'écosystème d'apprentissage de l'INPG.
        </p>
      </div>
      <div class="w-full max-w-4xl mx-auto rounded-lg overflow-hidden shadow-lg my-stack-lg">
        <img alt="Étudiante travaillant sur un projet technique dans un environnement universitaire moderne" class="w-full h-auto object-cover" src="images/image_lms_accueil.jpeg">
      </div>
      </div>
      <div class="flex flex-col sm:flex-row items-center justify-center gap-stack-md pt-stack-sm">
        <button routerLink="/auth/login" (click)="test()" class="w-full sm:w-auto px-10 py-4 bg-secondary text-on-secondary rounded-lg font-label-md shadow-lg hover:shadow-xl hover:translate-y-[-1px] transition-all flex items-center justify-center gap-stack-sm">
          Se connecter
          <span class="material-symbols-outlined">login</span>
        </button>
        <button routerLink="/catalogue" class="w-full sm:w-auto px-10 py-4 bg-white border border-outline-variant text-primary rounded-lg font-label-md hover:bg-surface-container-low transition-all">
          Consulter le catalogue
        </button>
      </div>
      <div class="pt-12">
        <p class="text-label-sm text-outline font-medium uppercase tracking-[0.2em]">
          Institut National du Pétrole et du Gaz
        </p>
      </div>
  </section>
</main>
