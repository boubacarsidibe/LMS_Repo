<div class="p-margin-desktop space-y-stack-lg max-w-container-max mx-auto">
  <header>
    <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mb-2 block">Vie de l’institut</span>
    <h1 class="font-display text-display text-on-surface leading-none -ml-1">Photothèque</h1>
    <p class="font-body-lg text-body-lg text-on-surface-variant mt-4 max-w-2xl">
      Les albums des sorties, visites et temps forts de l’INPG.
    </p>
  </header>

  <p *ngIf="messageSucces" class="font-body-sm text-body-sm text-on-surface bg-secondary-container/30 rounded-lg px-4 py-3">
    {{ messageSucces }}
  </p>
  <p *ngIf="messageErreur" class="font-body-sm text-body-sm text-error bg-error-container/20 rounded-lg px-4 py-3">
    {{ messageErreur }}
  </p>

  <app-ui-spinner *ngIf="chargement" message="Chargement des albums…"></app-ui-spinner>

  <ng-container *ngIf="!chargement">
    <!-- ===================== Dépôt d'un cliché ===================== -->
    <section class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm p-stack-lg space-y-stack-md">
      <h2 class="font-headline-sm text-headline-sm text-primary flex items-center gap-2">
        <span class="material-symbols-outlined text-secondary">upload</span>Ajouter une photo
      </h2>

      <app-ui-empty-state
        *ngIf="albums.length === 0"
        icone="photo_library"
        titre="Aucun album"
        description="Le responsable pédagogique n’a pas encore créé d’album : une photo appartient toujours à un album."
      ></app-ui-empty-state>

      <div *ngIf="albums.length > 0" class="grid grid-cols-1 md:grid-cols-3 gap-gutter items-end">
        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant">Album</span>
          <select
            [(ngModel)]="albumCibleId"
            class="p-3 bg-surface-container-low rounded-lg border border-outline-variant font-body-sm text-body-sm text-on-surface">
            <option [ngValue]="null">Choisissez un album…</option>
            <option *ngFor="let a of albums" [ngValue]="a.id">{{ a.titre }}</option>
          </select>
        </label>

        <label class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant">Légende (facultative)</span>
          <input
            type="text"
            [(ngModel)]="legende"
            placeholder="Ex. : briefing sécurité"
            class="p-3 bg-surface-container-low rounded-lg border border-outline-variant font-body-sm text-body-sm text-on-surface" />
        </label>

        <div class="flex flex-col gap-1">
          <span class="font-label-sm text-label-sm text-on-surface-variant">Fichier</span>
          <input #champFichier type="file" accept="image/*" (change)="fichierChoisi($event)" class="hidden" />
          <button
            type="button"
            (click)="ouvrirExplorateur()"
            class="p-3 bg-surface-container-low rounded-lg border border-dashed border-outline-variant font-body-sm text-body-sm text-on-surface-variant hover:bg-surface-container transition-colors text-left truncate">
            {{ fichierSelectionne ? fichierSelectionne.name : 'Choisir une image…' }}
          </button>
        </div>
      </div>

      <button
        *ngIf="albums.length > 0"
        type="button"
        [disabled]="!depotPossible"
        (click)="envoyerPhoto()"
        class="flex items-center gap-2 px-6 py-2.5 bg-secondary text-on-secondary rounded-lg font-label-md text-label-md leading-none hover:opacity-90 transition-colors disabled:opacity-50">
        <span class="material-symbols-outlined text-[20px] leading-none">send</span>
        {{ enCours ? 'Envoi…' : 'Envoyer' }}
      </button>
    </section>

    <!-- ===================== Albums ===================== -->
    <section class="space-y-stack-md">
      <h2 class="font-headline-sm text-headline-sm text-primary flex items-center gap-2">
        <span class="material-symbols-outlined text-secondary">photo_library</span>Albums
      </h2>

      <app-ui-empty-state
        *ngIf="albums.length === 0"
        icone="photo_library"
        titre="Aucun album"
        description="Les albums créés par le responsable pédagogique apparaîtront ici."
      ></app-ui-empty-state>

      <ul *ngIf="albums.length > 0" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-gutter">
        <li *ngFor="let a of albums">
          <button
            type="button"
            (click)="ouvrirAlbum(a)"
            class="w-full h-full text-left bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden hover:border-secondary transition-colors">
            <div class="h-40 bg-surface-container flex items-center justify-center">
              <img
                *ngIf="a.couvertureUrl; else sansCouverture"
                [src]="media.image(a.couvertureUrl) | async"
                [alt]="'Couverture de ' + a.titre"
                class="w-full h-full object-cover" />
              <ng-template #sansCouverture>
                <span class="material-symbols-outlined text-on-surface-variant text-[40px]">image</span>
              </ng-template>
            </div>
            <div class="p-stack-md">
              <p class="font-label-md text-label-md text-on-surface">{{ a.titre }}</p>
              <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
                {{ a.nbPhotos }} photo(s)
                <ng-container *ngIf="a.dateEvenement"> · {{ a.dateEvenement | date: 'dd/MM/yyyy' }}</ng-container>
              </p>
              <p class="font-body-sm text-body-sm text-on-surface-variant">
                {{ a.promotionLibelle || 'Tout l’institut' }}
              </p>
            </div>
          </button>
        </li>
      </ul>
    </section>
  </ng-container>
</div>

<!-- ===================== Visionneuse d'un album ===================== -->
<div
  *ngIf="albumOuvert"
  class="fixed inset-0 bg-inverse-surface/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4"
  (click)="fermerAlbum()">
  <div
    class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant w-full max-w-4xl max-h-[85vh] overflow-y-auto"
    (click)="$event.stopPropagation()">
    <header class="flex items-start justify-between gap-4 px-stack-lg py-stack-md border-b border-outline-variant">
      <div>
        <h2 class="font-headline-sm text-headline-sm text-primary">{{ albumOuvert.titre }}</h2>
        <p *ngIf="albumOuvert.description" class="font-body-sm text-body-sm text-on-surface-variant mt-1">
          {{ albumOuvert.description }}
        </p>
      </div>
      <button
        type="button"
        (click)="fermerAlbum()"
        aria-label="Fermer l’album"
        class="p-1 text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
        <span class="material-symbols-outlined">close</span>
      </button>
    </header>

    <div class="p-stack-lg">
      <app-ui-spinner *ngIf="chargementPhotos" message="Chargement des photos…"></app-ui-spinner>

      <app-ui-empty-state
        *ngIf="!chargementPhotos && photosAlbumOuvert.length === 0"
        icone="image"
        titre="Album vide"
        description="Aucune photo n’a encore été déposée dans cet album."
      ></app-ui-empty-state>

      <ul *ngIf="!chargementPhotos && photosAlbumOuvert.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-gutter">
        <li *ngFor="let p of photosAlbumOuvert" class="rounded-lg overflow-hidden border border-outline-variant">
          <img [src]="media.image(p.url) | async" [alt]="p.legende || 'Photo'" class="w-full h-44 object-cover" />
          <p *ngIf="p.legende" class="font-body-sm text-body-sm text-on-surface-variant p-2">{{ p.legende }}</p>
        </li>
      </ul>
    </div>
  </div>
</div>
