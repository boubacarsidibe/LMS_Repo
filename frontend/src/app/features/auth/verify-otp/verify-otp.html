<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-100">

        <!-- En-tête -->
        <div class="text-center">
            <h2 class="text-2xl font-bold text-gray-900">Vérification OTP</h2>
            <p class="mt-2 text-sm text-gray-600">
                Un code à 6 chiffres a été envoyé à<br />
                <span class="font-medium text-indigo-600">{{ email || 'votre adresse email' }}</span>
            </p>
        </div>

        <!-- Message d'erreur global -->
        <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-md transition-all">
            <p class="text-sm text-red-700 font-medium">{{ errorMessage }}</p>
        </div>

        <!-- Formulaire -->
        <form [formGroup]="otpForm" (ngSubmit)="onVerify()" class="mt-8 space-y-6">
            <div>
                <label for="code" class="block text-sm font-medium text-gray-700 text-center mb-2">
                    Saisissez votre code
                </label>

                <input id="code" type="text" inputmode="numeric" formControlName="code" placeholder="123456" maxlength="6"
                    autocomplete="one-time-code"
                    class="w-full text-center tracking-[0.5em] text-2xl font-semibold py-3 px-4 rounded-lg border text-gray-900 placeholder-gray-300 focus:outline-none transition-colors"
                    [ngClass]="{
                        'border-red-500 focus:ring-2 focus:ring-red-500 focus:border-red-500': otpForm.get('code')?.touched && otpForm.get('code')?.invalid,
                        'border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500': !otpForm.get('code')?.touched || otpForm.get('code')?.valid
                    }" />

                <!-- Validation en direct -->
                <div *ngIf="otpForm.get('code')?.touched && otpForm.get('code')?.invalid" class="mt-2 text-center">
                    <p *ngIf="otpForm.get('code')?.errors?.['required']" class="text-xs text-red-600">
                        Le code est obligatoire.
                    </p>
                    <p *ngIf="otpForm.get('code')?.errors?.['minlength'] || otpForm.get('code')?.errors?.['maxlength']"
                        class="text-xs text-red-600">
                        Le code doit comporter exactement 6 chiffres.
                    </p>
                </div>
            </div>

            <!-- Bouton d'action -->
            <button type="submit" [disabled]="otpForm.invalid"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                Valider le code
            </button>
        </form>

        <!-- Option Renvoyer le code -->
        <div class="text-center text-sm text-gray-500 mt-6">
            Vous n'avez pas reçu le code ?
            <button type="button" (click)="onResendCode()" class="font-semibold text-indigo-600 hover:underline focus:outline-none ml-1">
                Renvoyer
            </button>
        </div>

    </div>
</div>
