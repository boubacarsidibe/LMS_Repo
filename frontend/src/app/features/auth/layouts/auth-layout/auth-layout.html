<div class="min-h-screen bg-surface-container-low flex items-center justify-center p-4 w-full">
    <!--
      Pas de hauteur maximale ni de scroll interne : a fort niveau de zoom, un
      conteneur a hauteur plafonnee (max-h + overflow-hidden) combine a un
      contenu centre (justify-center) dans une zone overflow-y-auto masque le
      haut du contenu qui deborde au lieu de le rendre atteignable au scroll.
      La carte grandit avec son contenu et c'est la page elle-meme qui defile.
    -->
    <div class="w-full max-w-5xl bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant flex flex-col md:flex-row my-8 md:my-auto">

      <!-- GAUCHE : La bannière fixe (SidebarAuth) -->
      <app-sidebar-auth class="hidden md:flex md:w-1/2 flex-shrink-0"></app-sidebar-auth>

      <!-- DROITE : Zone de formulaire -->
      <div class="w-full md:w-1/2 p-6 sm:p-8 md:p-12 flex flex-col justify-center bg-surface-container-lowest">
        <span class="text-2xl font-extrabold tracking-tight text-primary mb-8 block">INPG<span class="text-brand"> LMS</span></span>
        <router-outlet></router-outlet>
      </div>

    </div>
  </div>
