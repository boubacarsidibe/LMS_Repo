<div class="bg-surface-container-low min-h-screen flex items-center justify-center p-4">
    <!-- Card Principale -->
    <div class="w-full max-w-md bg-surface-container-lowest p-8 md:p-10 rounded-xl shadow-sm border border-outline-variant">
        
        <!-- En-tête -->
        <div class="text-center mb-8">
            <h1 class="font-headline-md text-headline-md text-primary mb-1">Bienvenue</h1>
            <p class="font-body-sm text-body-sm text-on-surface-variant">Veuillez entrer vos identifiants pour continuer</p>
        </div>

        <!-- Alerte d'erreur dynamique -->
        <div *ngIf="errorMessage"
            class="mb-6 p-3.5 bg-error-container border border-error/20 text-on-error-container font-body-sm text-body-sm rounded-lg text-center flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-base">error</span>
            <span>{{ errorMessage }}</span>
        </div>

        <!-- Formulaire Angular -->
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

            <!-- Champ Email -->
            <div>
                <label for="email" class="block font-label-md text-label-md text-on-surface-variant mb-1.5">
                    Email
                </label>
                <input type="email" id="email" formControlName="email" placeholder="alex.dupont@example.com"
                    class="form-input w-full px-4 py-2.5 rounded-lg border border-outline-variant font-body-md text-body-md text-on-surface bg-surface-container-lowest focus:border-secondary focus:ring-0 transition-shadow placeholder:text-outline"
                    [class.border-error]="form.get('email')?.invalid && form.get('email')?.touched">

                <!-- Validation Email -->
                <p *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="font-label-sm text-label-sm text-error mt-1 flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">warning</span>
                    Veuillez entrer une adresse e-mail valide.
                </p>
            </div>

            <!-- Champ Mot de passe -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block font-label-md text-label-md text-on-surface-variant">
                        Mot de passe
                    </label>
                    <a routerLink="/forgot-password" class="font-label-sm text-label-sm text-secondary hover:underline">
                        Oublié ?
                    </a>
                </div>
                <input type="password" id="password" formControlName="password" placeholder="••••••••"
                    class="form-input w-full px-4 py-2.5 rounded-lg border border-outline-variant font-body-md text-body-md text-on-surface bg-surface-container-lowest focus:border-secondary focus:ring-0 transition-shadow placeholder:text-outline"
                    [class.border-error]="form.get('password')?.invalid && form.get('password')?.touched">

                <!-- Validation Mot de passe -->
                <p *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="font-label-sm text-label-sm text-error mt-1 flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">warning</span>
                    Le mot de passe est obligatoire.
                </p>
            </div>

            <!-- Champ OTP (Affiché dynamiquement) -->
            <div *ngIf="showOtpField" class="mt-4 pt-4 border-t border-outline-variant">
                <label for="otp" class="block font-label-md text-label-md text-on-surface-variant mb-1.5">
                    Code OTP
                </label>
                <input type="text" id="otp" formControlName="code" placeholder="123456"
                    class="form-input w-full px-4 py-2.5 rounded-lg border border-outline-variant font-body-md text-body-md text-on-surface bg-surface-container-lowest focus:border-secondary focus:ring-0 transition-shadow tracking-widest text-center placeholder:text-outline"
                    [class.border-error]="form.get('code')?.invalid && form.get('code')?.touched">

                <!-- Validation OTP -->
                <p *ngIf="form.get('code')?.invalid && form.get('code')?.touched" class="font-label-sm text-label-sm text-error mt-1 flex items-center justify-center gap-1">
                    <span class="material-symbols-outlined text-sm">warning</span>
                    Veuillez entrer un code OTP valide.
                </p>

                <button type="button" (click)="verifyOtp()" 
                    class="w-full mt-4 bg-tertiary text-on-tertiary font-label-md text-label-md py-3 px-4 rounded-lg hover:bg-opacity-90 transition-all shadow-sm">
                    Vérifier le code
                </button>
            </div>

            <!-- Bouton de connexion classique -->
            <div class="mt-6" *ngIf="!showOtpField">
                <button type="submit" [disabled]="form.invalid"
                    class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-3 px-4 rounded-lg hover:bg-opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-[inset_0_1px_0_rgba(255,255,255,0.2)]">
                    Se connecter
                </button>
            </div>

        </form>

        <!-- Pied de carte -->
        <p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-8">
            Pas encore de compte ?
            <a routerLink="/register" class="font-semibold text-secondary hover:underline">S'inscrire</a>
        </p>
    </div>
</div>
