<div class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
        <!-- En-tête -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">Bienvenue</h1>
            <p class="text-sm text-slate-500 mt-1">Veuillez entrer vos identifiants pour continuer</p>
        </div>

        <!-- Alerte d'erreur dynamique -->
        <div *ngIf="errorMessage"
            class="mb-4 p-3 bg-red-100 border border-red-300 text-red-700 text-sm rounded-lg text-center">
            {{ errorMessage }}
        </div>

        <!-- Formulaire Angular -->
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5">

            <!-- Champ Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
                    Email
                </label>
                <input type="email" id="email" formControlName="email" placeholder="alex.dupont@example.com"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    [class.border-red-500]="form.get('email')?.invalid && form.get('email')?.touched">

                <!-- Validation Email -->
                <p *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-xs text-red-500 mt-1">
                    Veuillez entrer une adresse e-mail valide.
                </p>
            </div>

            <!-- Champ Mot de passe -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="block text-sm font-medium text-slate-700">
                        Mot de passe
                    </label>
                    <a routerLink="/forgot-password" class="text-xs font-semibold text-blue-600 hover:underline">
                        Oublié ?
                    </a>
                </div>
                <input type="password" id="password" formControlName="password" placeholder="••••••••"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    [class.border-red-500]="form.get('password')?.invalid && form.get('password')?.touched">

                <!-- Validation Mot de passe -->
                <p *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
                    class="text-xs text-red-500 mt-1">
                    Le mot de passe est obligatoire.
                </p>
            </div>
            <!-- champs otp -->
            <div *ngIf="showOtpField" class="mt-4">
                <label for="otp" class="block text-sm font-medium text-slate-700 mb-1">
                    Code OTP
                </label>
                <input type="text" id="otp" formControlName="code" placeholder="123456"
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    [class.border-red-500]="form.get('code')?.invalid && form.get('code')?.touched">

                <!-- Validation OTP -->
                <p *ngIf="form.get('code')?.invalid && form.get('code')?.touched" class="text-xs text-red-500 mt-1">
                    Veuillez entrer un code OTP valide.
                </p>

                <button type="button" (click)="verifyOtp()"
                    class="w-full mt-4 bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2">
                    Vérifier le code
                </button>
            </div>
            <div class="mt-6" *ngIf="!showOtpField">

                <!-- Bouton de soumission -->
                <button type="submit" [disabled]="form.invalid"
                    class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    se connecter
                </button>


            </div>

        </form>

        <!-- Pied de carte -->
        <p class="text-center text-sm text-slate-500 mt-6">
            Pas encore de compte ?
            <a routerLink="/register" class="font-semibold text-blue-600 hover:underline">S'inscrire</a>
        </p>
    </div>
   
</div>
