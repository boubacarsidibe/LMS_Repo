<!-- TopNavBar : utilisée uniquement dans l'espace étudiant authentifié
     (route guardée ROLE_ETUDIANT) — pas de branche "non connecté" ni de
     notifications de candidature, qui n'ont pas de sens pour cette page. -->
<header class="bg-white/95 backdrop-blur-sm border-b border-[#c7c5d0]/40 fixed top-0 left-0 right-0 z-50">
  <div class="flex justify-between items-center w-full max-w-[1280px] mx-auto px-4 md:px-10 h-[72px]">
    <!-- Brand -->
    <a routerLink="/espace-etudiant/accueil" class="text-2xl font-extrabold tracking-tight text-[#30609a] no-underline hover:opacity-80 transition-opacity">
      INPG<span class="text-[#131741]"> LMS</span>
    </a>

    <!-- Navigation Links (Desktop) - centered -->
    <nav class="hidden md:flex flex-1 justify-center items-center gap-6">
      <a routerLink="/espace-etudiant/accueil" routerLinkActive="text-[#30609a]" class="px-3 py-2 text-sm font-medium text-[#46464e] hover:text-[#30609a]">Accueil</a>
      <a *ngIf="isEtudiantRole" routerLink="/espace-etudiant/mes-formations" routerLinkActive="text-[#30609a] border-b-2 border-[#30609a]" class="px-3 py-2 text-sm font-medium text-[#46464e] hover:text-[#30609a]">Mes formations</a>
      <a *ngIf="isFormateurRole" routerLink="/espace-etudiant/formateur/dashboard-formateur" routerLinkActive="text-[#30609a] border-b-2 border-[#30609a]" class="px-3 py-2 text-sm font-medium text-[#46464e] hover:text-[#30609a]">Espace formateur</a>
    </nav>

    <!-- Avatar utilisateur + dropdown -->
    <div class="flex items-center gap-3">
      <div class="relative">
        <button
          id="profile-btn"
          (click)="toggleDropdown()"
          class="flex items-center gap-3 p-1.5 rounded-full hover:bg-[#f2f4f6] transition-colors cursor-pointer border-0 bg-transparent"
          aria-label="Menu utilisateur">
          <div class="w-9 h-9 rounded-full bg-[#30609a] text-white flex items-center justify-center text-sm font-semibold shadow-sm">
            {{ userInitials }}
          </div>
          <div class="hidden sm:flex flex-col items-start leading-tight">
            <span class="text-sm font-medium text-[#191c1e]">{{ userDisplayName }}</span>
            <span class="text-xs uppercase text-[#77767f]">{{ getUserRoleLabel() }}</span>
          </div>
          <span class="material-symbols-outlined text-[#77767f] text-[20px]" style="font-variation-settings: 'FILL' 0;">
            {{ dropdownOpen ? 'expand_less' : 'expand_more' }}
          </span>
        </button>

        <!-- Dropdown Menu -->
        <div
          *ngIf="dropdownOpen"
          id="profile-dropdown"
          class="absolute right-0 mt-2 w-56 bg-white border border-[#c7c5d0] rounded-xl shadow-lg py-1 z-50 origin-top-right animate-in fade-in zoom-in-95">
          <div class="px-4 py-3 border-b border-[#c7c5d0]/40">
            <p class="text-sm font-semibold text-[#000002] capitalize">{{ userDisplayName }}</p>
          </div>
          <a (click)="goToDashboard()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-[#46464e] hover:bg-[#f2f4f6] hover:text-[#30609a] cursor-pointer transition-colors">
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">dashboard</span>
            Tableau de bord
          </a>
          <hr class="my-1 border-[#c7c5d0]/40">
          <a (click)="logout()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-[#46464e] hover:bg-[#ffdad6] hover:text-[#ba1a1a] cursor-pointer transition-colors">
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">logout</span>
            Déconnexion
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- Spacer for fixed navbar -->
<div class="h-[72px]"></div>

<!-- Backdrop pour fermer le dropdown au clic extérieur -->
<div *ngIf="dropdownOpen" class="fixed inset-0 z-40" (click)="closeDropdown()"></div>
