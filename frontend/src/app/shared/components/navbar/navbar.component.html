<!-- TopNavBar -->
<header class="bg-white/95 backdrop-blur-sm border-b border-[#c7c5d0]/40 fixed top-0 left-0 right-0 z-50">
  <div class="flex justify-between items-center w-full max-w-[1280px] mx-auto px-4 md:px-10 h-[72px]">
    <!-- Brand -->
    <a routerLink="/accueil" class="text-2xl font-extrabold tracking-tight text-[#30609a] no-underline hover:opacity-80 transition-opacity">
      INPG<span class="text-[#131741]"> LMS</span>
    </a>

    <!-- Navigation Links (Desktop) -->
    <nav class="hidden md:flex items-center gap-1">
      <a routerLink="/accueil" routerLinkActive="text-[#30609a] bg-[#30609a]/8" [routerLinkActiveOptions]="{exact: true}" class="relative px-4 py-2 text-sm font-medium text-[#46464e] hover:text-[#30609a] hover:bg-[#f2f4f6] rounded-lg transition-all duration-200">
        Accueil
      </a>
      <a routerLink="/institut" routerLinkActive="text-[#30609a] bg-[#30609a]/8" class="relative px-4 py-2 text-sm font-medium text-[#46464e] hover:text-[#30609a] hover:bg-[#f2f4f6] rounded-lg transition-all duration-200">
        Institut
      </a>
      <a routerLink="/contact" routerLinkActive="text-[#30609a] bg-[#30609a]/8" class="relative px-4 py-2 text-sm font-medium text-[#46464e] hover:text-[#30609a] hover:bg-[#f2f4f6] rounded-lg transition-all duration-200">
        Contact
      </a>
      <a routerLink="/recrutement/catalogue" routerLinkActive="text-[#30609a] bg-[#30609a]/8" class="relative px-4 py-2 text-sm font-medium text-[#46464e] hover:text-[#30609a] hover:bg-[#f2f4f6] rounded-lg transition-all duration-200">
        Catalogue
      </a>
      <a *ngIf="isLoggedIn" routerLink="/recrutement/candidature" routerLinkActive="text-[#30609a] bg-[#30609a]/8" class="relative px-4 py-2 text-sm font-medium text-[#46464e] hover:text-[#30609a] hover:bg-[#f2f4f6] rounded-lg transition-all duration-200">
        Candidature
      </a>
    </nav>

    <!-- Actions (Desktop) -->
    <div class="flex items-center gap-3">
      <!-- Non connecté : boutons Connexion / Inscription -->
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/auth/login" class="hidden md:inline-flex items-center px-4 py-2 text-sm font-medium text-[#46464e] hover:text-[#30609a] hover:bg-[#f2f4f6] rounded-lg transition-all duration-200 no-underline">
          Se connecter
        </a>
        <a routerLink="/auth/register" class="inline-flex items-center px-5 py-2.5 bg-[#30609a] text-white text-sm font-semibold rounded-lg hover:bg-[#254d7d] active:scale-95 transition-all duration-200 shadow-sm shadow-[#30609a]/20 no-underline">
          S'inscrire
        </a>
      </ng-container>

      <!-- Connecté : avatar + dropdown -->
      <div *ngIf="isLoggedIn" class="relative">
        <button
          (click)="toggleDropdown()"
          class="flex items-center gap-2 p-1.5 rounded-full hover:bg-[#f2f4f6] transition-colors cursor-pointer border-0 bg-transparent"
          aria-label="Menu utilisateur">
          <!-- Avatar -->
          <div class="w-9 h-9 rounded-full bg-[#30609a] text-white flex items-center justify-center text-sm font-semibold shadow-sm">
            {{ userInitials }}
          </div>
          <span class="material-symbols-outlined text-[#77767f] text-[20px]" style="font-variation-settings: 'FILL' 0;">
            {{ dropdownOpen ? 'expand_less' : 'expand_more' }}
          </span>
        </button>

        <!-- Dropdown Menu -->
        <div
          *ngIf="dropdownOpen"
          class="absolute right-0 mt-2 w-56 bg-white border border-[#c7c5d0] rounded-xl shadow-lg py-1 z-50 origin-top-right animate-in fade-in zoom-in-95">
          <!-- User info header -->
          <div class="px-4 py-3 border-b border-[#c7c5d0]/40">
            <p class="text-sm font-semibold text-[#000002] capitalize">{{ userDisplayName }}</p>
          </div>
          <!-- Menu items -->
          <a (click)="goToDashboard()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-[#46464e] hover:bg-[#f2f4f6] hover:text-[#30609a] cursor-pointer transition-colors">
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">dashboard</span>
            Tableau de bord
          </a>
          <a (click)="goToMesCandidatures()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-[#46464e] hover:bg-[#f2f4f6] hover:text-[#30609a] cursor-pointer transition-colors">
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">description</span>
            Mes candidatures
          </a>
          <hr class="my-1 border-[#c7c5d0]/40">
          <a (click)="logout()" class="flex items-center gap-3 px-4 py-2.5 text-sm text-[#46464e] hover:bg-[#ffdad6] hover:text-[#ba1a1a] cursor-pointer transition-colors">
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">logout</span>
            Déconnexion
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- Spacer for fixed navbar -->
<div class="h-[72px]"></div>

<!-- Backdrop for closing dropdown on outside click -->
<div
  *ngIf="dropdownOpen"
  class="fixed inset-0 z-40"
  (click)="closeDropdown()">
</div>
