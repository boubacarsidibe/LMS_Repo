name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main
      - preprod
      - develop
  pull_request:
    branches:
      - main
      - preprod
      - develop

jobs:
  build-and-test:
    name: Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Configuration du JDK Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Donne les permissions d'exécution au wrapper Maven
      - name: Make mvnw executable
        run: chmod +x mvnw

      # Compilation et exécution des tests unitaires/intégration
      - name: Build and Test with Maven
        run: ./mvnw clean package

      # Sauvegarde de l'artefact JAR généré pour la suite
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: target/*.jar

  deploy:
    name: Deploy Environment
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app

      # --- Déploiement DEVELOP ---
      - name: Deploy to Staging / Develop
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "🚀 Déploiement de l'application Spring Boot sur DEVELOP..."
          # Ex: scp target/app.jar user@dev-server:/app/

      # --- Déploiement PREPROD ---
      - name: Deploy to Pre-production
        if: github.ref == 'refs/heads/preprod'
        run: |
          echo "🧪 Déploiement de l'application Spring Boot sur PREPROD..."
          # Ex: java -jar app.jar --spring.profiles.active=preprod

      # --- Déploiement MAIN (PROD) ---
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🔥 Déploiement de l'application Spring Boot sur PRODUCTION..."
          # Ex: commande de déploiement prod