name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main
      - preprod
      - develop
  pull_request:
    branches:
      - main
      - preprod
      - develop

jobs:
  build-and-test:
    name: Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    # --- CONTENEUR POSTGRESQL POUR LES TESTS ---
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms_test_db
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: lms_password
        ports:
          - 5432:5432
        # Attend que PostgreSQL soit prêt avant d'exécuter les tests
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      # --- EXECUTION DU BUILD AVEC VARIABLES POSTGRESQL ---
      - name: Build and Test with Maven
        run: ./mvnw clean package
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lms_test_db
          SPRING_DATASOURCE_USERNAME: lms_user
          SPRING_DATASOURCE_PASSWORD: lms_password
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: update

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: backend/target/*.jar

  deploy:
    name: Deploy Environment
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app
          path: target

      - name: Deploy to Staging / Develop
        if: github.ref == 'refs/heads/develop'
        run: echo "🚀 Déploiement sur DEVELOP..."

      - name: Deploy to Pre-production
        if: github.ref == 'refs/heads/preprod'
        run: echo "🧪 Déploiement sur PREPROD..."

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: echo "🔥 Déploiement sur PRODUCTION..."