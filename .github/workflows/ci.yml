name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main
      - preprod
      - develop
  pull_request:
    branches:
      - main
      - preprod
      - develop

jobs:
  build-and-test:
    name: Build & Test (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and Test with Maven
        run: ./mvnw clean package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          # Indique explicitement le sous-dossier backend
          path: backend/target/*.jar

  deploy:
    name: Deploy Environment
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app
          # Télécharge l'artefact directement dans un dossier target/
          path: target

      # --- Déploiement DEVELOP ---
      - name: Deploy to Staging / Develop
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "🚀 Déploiement sur DEVELOP..."
          # target/ contient maintenant votre JAR

      # --- Déploiement PREPROD ---
      - name: Deploy to Pre-production
        if: github.ref == 'refs/heads/preprod'
        run: |
          echo "🧪 Déploiement sur PREPROD..."

     
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🔥 Déploiement sur PRODUCTION..."