name: CI Backend (Develop)

# Déclenchement sur push ou PR vers la branche develop
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch: # Permet de relancer le pipeline manuellement depuis l'interface GitHub

jobs:
  # -------------------------------------------------------------
  # JOB 1 : Build & Tests Java avec Maven
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test Maven
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Maintient les dépendances en cache pour accélérer les futurs builds

      - name: Compiler et exécuter les tests
        working-directory: ./backend
        run: mvn clean test package

  # -------------------------------------------------------------
  # JOB 2 : Vérification du Build Docker Multi-Stage
  # -------------------------------------------------------------
  docker-build-test:
    name: Test du Build Docker
    runs-on: ubuntu-latest
    needs: build-and-test # S'exécute seulement si la compilation Maven a réussi

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Vérifier la construction de l'image Docker
        working-directory: ./backend
        run: docker build -t lms-backend:develop .