name: CI Backend (Develop)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Maven
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compiler et exécuter les tests
        # ATTENTION : Ne mettez PAS -DskipTests ici !
        # Si un seul test unitaires échoue, l'étape s'arrête et marque le pipeline en ROUGE ❌
        run: mvn clean verify

  docker-build-test:
    name: Test du Build Docker
    runs-on: ubuntu-latest
    needs: build-and-test # Cette étape ne s'exécute QUE SI la précédente a réussi (100% vert)

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Vérifier la construction de l'image Docker
        run: docker build -t lms-backend:develop .