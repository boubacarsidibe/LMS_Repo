name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - preprod
      - main
  pull_request:
    branches:
      - develop
      - preprod
      - main
  workflow_dispatch: {}

jobs:
  # -------------------------------------------------------------
  # JOB 1 : COMPILATION ET TESTS SOURCÉS (Develop / PR / Main)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test (Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms_test_db
          POSTGRES_USER: lms_user
          POSTGRES_PASSWORD: lms_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and Test with Maven
        run: ./mvnw clean package
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lms_test_db
          SPRING_DATASOURCE_USERNAME: lms_user
          SPRING_DATASOURCE_PASSWORD: lms_password
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          JWT_SECRET: ci_only_jwt_secret_must_be_at_least_thirty_two_bytes_long_2026
          MAIL_USERNAME: ci@example.test
          MAIL_PASSWORD: ci-password
          APP_MAIL_FROM: no-reply@example.test
          APP_DEMO_DATA_ENABLED: "false"

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: backend/target/*.jar

  frontend-quality:
    name: Build & Test (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production

      - name: Run Angular tests
        run: npm test -- --watch=false

  # -------------------------------------------------------------
  # JOB 2 : AUTO-MERGE DE DEVELOP VERS PREPROD (Si le Build réussit)
  # -------------------------------------------------------------
  promote-to-preprod:
    name: Sync Develop -> Preprod
    needs: [build-and-test, frontend-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Récupère toutes les branches

      - name: Push direct sur preprod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout preprod || git checkout -b preprod
          git merge origin/develop --ff-only || git merge origin/develop -m "Auto-promote develop to preprod"
          git push origin preprod

  # -------------------------------------------------------------
  # JOB 3 : DÉPLOIEMENT PREPROD
  # -------------------------------------------------------------
  deploy-preprod:
    name: Deploy to Pre-production
    needs: [build-and-test, frontend-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/preprod'

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app

      - name: Deploy Script
        run: echo "🧪 Déploiement automatique sur l'environnement PREPROD..."

  # -------------------------------------------------------------
  # JOB 4 : DÉPLOIEMENT PRODUCTION (Validation Manuelle Requise)
  # -------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: [build-and-test, frontend-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production # <-- Nécessite votre approbation dans GitHub Settings

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app

      - name: Deploy Script
        run: echo "🔥 Déploiement validé manuellement sur la PRODUCTION !"
